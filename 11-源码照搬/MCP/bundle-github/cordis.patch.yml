# GitHub（MCP）
#
# 把官方 github/github-mcp-server v2.2.0 作为 stdio MCP 服务器接进来。
# 工具前缀：mcp__github__*
#
# ⚠ 为什么经由 launch.mjs 启动，而不是直接指向 exe：
#   mcp-client 的 ${credential:...} 模板要求**加载阶段**就能 ctx.get('credentials')，
#   但 bundle 层拿不到凭据服务，实测直接报
#   「MCP credential templates require a credentials provider」导致整个条目不激活。
#   所以改由 launch.mjs 在运行时从 $DSH_HOME/.credentials.yaml 读令牌再喂给子进程，
#   令牌不进任何配置文件、不进本文件、不进 git。
#
# ⚠ 路径为什么这么写（与 bundle-iconfont 同一套判据）：
#   ① MCP 子进程的 cwd 不由我们控制，相对路径会在别处解析失败。
#   ② 子进程环境会被清洗（删除所有 DSH_* 变量），所以路径必须在**父进程**算好再传进去。
#   ③ !!js 的求值上下文是 ESM：⛔ 不能用 require。
#   ④ 这里只用 ASCII 正则：DSH_HOME = <工作台根>\引擎数据\.dsh，
#      去掉「\.dsh 及其上一段」就是工作台根，不必在源码里写中文，避免编码风险。
- insert:
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: !!js process.env.DSH_NODE_EXECUTABLE || 'node'
        args:
          - !!js String(process.env.DSH_HOME || '').replace(/[\\/][^\\/]+[\\/]\.dsh[\\/]?$/, '') + '/MCP/github-mcp-server/launch.mjs'
          - stdio
        cwd: !!js String(process.env.DSH_HOME || '').replace(/[\\/][^\\/]+[\\/]\.dsh[\\/]?$/, '') + '/MCP/github-mcp-server'
        env:
          # ⚠ 不能用 DSH_ 前缀：mcp-client 会删掉子进程里所有 DSH_* 变量。
          #   路径在父进程算好，子进程只负责读。
          GITHUB_MCP_CREDENTIALS_FILE: !!js String(process.env.DSH_HOME || '') + '/.credentials.yaml'
        # 搜索类工具会打 GitHub API，给足预算
        toolCallTimeoutMs: 60000
        startupTimeoutMs: 30000
        failOnStartupError: true
